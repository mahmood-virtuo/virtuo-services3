name: Deploy Virtuo Services

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            STAGING="/home/mahmood/web/virtuo-services3.167-233-103-0.sslip.io/public_html"
            PRODUCTION="/home/mahmood/web/virtuo.ae/public_html"

            git config --global --add safe.directory "$STAGING"

            cd "$STAGING"

            git reset --hard HEAD
            git pull origin main

            rsync -av --delete \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='.gitignore' \
              --exclude='.agents' \
              --exclude='.cursor' \
              --exclude='.gemini' \
              --exclude='AGENTS.md' \
              "$STAGING/" "$PRODUCTION/"

            chown -R mahmood:mahmood "$PRODUCTION"

            find "$PRODUCTION" -type d -exec chmod 755 {} \;
            find "$PRODUCTION" -type f -exec chmod 644 {} \;
